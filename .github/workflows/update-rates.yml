name: Multi-Source Currency Rates Refresh

on:
  schedule:
    # Pakistan Time (UTC+5) roughly:
    # 06:00, 09:00, 12:00, 15:00, 18:00, 21:00 PKT  → weekdays
    - cron: "0 1 * * 1-5"   # 06:00 PKT
    - cron: "0 4 * * 1-5"   # 09:00 PKT
    - cron: "0 7 * * 1-5"   # 12:00 PKT
    - cron: "0 10 * * 1-5"  # 15:00 PKT
    - cron: "0 13 * * 1-5"  # 18:00 PKT
    - cron: "0 16 * * 1-5"  # 21:00 PKT

    # Weekend: 2 times (crypto still useful)
    - cron: "0 4 * * 0,6"   # 09:00 PKT Sat/Sun
    - cron: "0 13 * * 0,6"  # 18:00 PKT Sat/Sun

  workflow_dispatch:   # Manual run button

permissions:
  contents: write

jobs:
  update-rates:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Update currency rates
        run: python update_rates.py

      - name: Commit and push
        run: |
          git config user.name "Tayyab-Currency-Bot"
          git config user.email "bot@tayyab-currency.local"

          git add v2/currencies/

          if git diff --cached --quiet; then
            echo "No rate changes detected."
            exit 0
          fi

          git commit -m "Automated multi-source currency rates update"
          git push
